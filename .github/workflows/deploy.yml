name: Build and Deploy to minikube

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t are-backend:${{ steps.vars.outputs.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t are-frontend:${{ steps.vars.outputs.sha }} \
            --build-arg NEXT_PUBLIC_API_BASE=http://are.local/api \
            ./frontend

      - name: Load images into minikube
        run: |
          minikube image load are-backend:${{ steps.vars.outputs.sha }}
          minikube image load are-frontend:${{ steps.vars.outputs.sha }}

      - name: Apply K8s manifests
        run: kubectl apply -f k8s/

      - name: Update deployments to new image
        run: |
          kubectl set image deployment/backend backend=are-backend:${{ steps.vars.outputs.sha }}
          kubectl set image deployment/frontend frontend=are-frontend:${{ steps.vars.outputs.sha }}
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
